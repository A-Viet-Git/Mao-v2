services:
  - type: web
    name: mao-table
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /app/storage
      - key: DEV_PASSPHRASE
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
